# Web Server
server:
  servlet:
    context-path: /vortex-ecommerce/api

# Logging
logging:
  level:
    academy.wakanda: ${LOG_LEVEL:DEBUG}

# Spring
spring:
  application:
    name: wakax-ecommerce
  profiles:
    active: ${APP_PROFILE:local}
  # Configura��o do Parameter Store (Spring Cloud AWS 3.x)
  # Para habilitar, defina a vari�vel de ambiente: AWS_PARAMETER_STORE_IMPORT=aws-parameterstore:/wakax/
  # Exemplo: aws-parameterstore:/wakax/
  # Para m�ltiplos paths: aws-parameterstore:/config/application/;/config/wakax-ecommerce/
  config:
    import: ${AWS_PARAMETER_STORE_IMPORT:}
  docker:
    compose:
      file: vortex_ecommerce/docker-compose.dev.yml
  cloud:
    aws:
      parameterstore:
        region: ${AWS_REGION:us-east-1}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # Database
  # Valores s�o carregados do Parameter Store ou vari�veis de ambiente
  # Ordem de preced�ncia: System Property (Parameter Store) > Environment Variable > Default
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/vortexdb?currentSchema=vortex}
    username: ${DATASOURCE_USER:postgres}
    password: ${DATASOURCE_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas:
      - vortex
    default-schema: vortex
    create-schemas: true

# Authentication
vortex:
  jwt:
    expiracao: ${JWT_TEMPO_EXPIRACAO:1440}
    chave: ${JWT_CHAVE:123456}
  otp:
    expiracao: ${OTP_TEMPO_EXPIRACAO:10}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

