# ATENÇÃO!
# Este arquivo é essencial para o deploy da aplicação em QA.
services:
  vortex:
    container_name: vortex-qa
    image: ghcr.io/${IMAGE_NAME}:qa-latest
    ports:
      - "${VORTEX_PORT}:8080"
    environment:
      - AWS_PARAMETER_STORE_IMPORT=${AWS_PARAMETER_STORE_IMPORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "${HEALTH_URL}"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
      disable: false
    restart: unless-stopped
